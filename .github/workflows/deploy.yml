name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency: deploy-group # only one deploy at a time
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # GitHub Secrets are the single place these values live; nothing sensitive
      # is printed or committed.
      - name: Set Fly secrets
        run: |
          flyctl secrets set --stage \
            DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            PUBLIC_BASE_URL="${{ secrets.PUBLIC_BASE_URL }}" \
            ADMIN_SECRET="${{ secrets.ADMIN_SECRET }}" \
            TOKEN_ENCRYPTION_KEY="${{ secrets.TOKEN_ENCRYPTION_KEY }}" \
            INTERVALS_API_KEY="${{ secrets.INTERVALS_API_KEY }}" \
            OURA_CLIENT_ID="${{ secrets.OURA_CLIENT_ID }}" \
            OURA_CLIENT_SECRET="${{ secrets.OURA_CLIENT_SECRET }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Migrate database
        run: npm ci && npm run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
