# Fly.io app for the training coach — separate from home-assist.
# Create once with: fly apps create training-plan

app = 'training-plan'
primary_region = 'syd'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  # Kept running: the scheduler syncs every 30 minutes.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
